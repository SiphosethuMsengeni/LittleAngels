<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | Little Angels Boutique</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body><div class="login-card"><a class="brand" href="/"><span class="brand-mark">♡</span><span><strong>{{shop_name}}</strong><small>SHOP ADMIN</small></span></a><h2 style="font:600 28px var(--serif);margin-top:30px">Welcome back</h2><p class="price-note">Enter your admin PIN to manage products and view website orders.</p>{% with messages=get_flashed_messages() %}{% for message in messages %}<p class="flash">{{message}}</p>{% endfor %}{% endwith %}<form method="post"><input name="pin" type="password" required placeholder="Admin PIN"><button class="primary-button full-button" type="submit">Log in</button></form><a href="/" class="price-note">← Back to shop</a></div></body></html>
